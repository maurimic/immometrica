services:
  immometrica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: immometrica-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENV=production
      - DATABASE_PATH=/data/immometrica.db
      - APP_USERNAME=${APP_USERNAME:-admin}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-immometrica-production-secret-key-32chars}
      - APP_BASE_URL=${APP_BASE_URL:-}
      - ONEPROVIDER_API_KEY=${ONEPROVIDER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - immometrica-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  immometrica-data:
