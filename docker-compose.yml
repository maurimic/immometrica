services:
  immometrica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: immometrica-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - TZ=Europe/Berlin
      - HOST=0.0.0.0
      - PORT=8000
      - ENV=production
      - DATABASE_PATH=/data/immometrica.db
      - APP_USERNAME=${APP_USERNAME:-admin}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-immometrica-production-secret-key-32chars}
      - APP_BASE_URL=${APP_BASE_URL:-https://immofinder-poggel-micciche.duckdns.org}
      - ONEPROVIDER_API_KEY=${ONEPROVIDER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SCRAPER_API_KEY=${SCRAPER_API_KEY:-}
      - SCRAPING_SERVICE=${SCRAPING_SERVICE:-scraperapi}
      - SCRAPER_PROXY_URL=${SCRAPER_PROXY_URL:-}
      - SCRAPER_DIRECT_FIRST=${SCRAPER_DIRECT_FIRST:-1}
      - SCRAPER_PREMIUM_MODE=${SCRAPER_PREMIUM_MODE:-fallback}
      - SCRAPER_API_ENABLED=${SCRAPER_API_ENABLED:-1}
      - SCRAPER_CANARY_USE_GATEWAY=${SCRAPER_CANARY_USE_GATEWAY:-1}
    volumes:
      - immometrica-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  immometrica-data:
