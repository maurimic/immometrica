<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Premium deep cyan to midnight navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#091428" />
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- House Gradient -->
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Lens Glass Gradient: Luminous cyan glass -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.70" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.65" />
    </linearGradient>

    <!-- Glass Flare Highlight -->
    <linearGradient id="flareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter for Magnifying Glass -->
    <filter id="glassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <!-- Subtle glow for roof -->
    <filter id="roofGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Squircle Tile (Curved Modern App Icon) -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35" />

  <!-- Chimney with cap -->
  <rect x="36" y="12" width="6.5" height="12" rx="1.5" fill="#64748b" />
  <rect x="35" y="10.5" width="8.5" height="2.5" rx="1" fill="#94a3b8" />

  <!-- House Body -->
  <rect x="13" y="27" width="35" height="25" rx="3.5" fill="url(#houseGrad)" />

  <!-- House Door & Left Window -->
  <rect x="18" y="32" width="7.5" height="8" rx="1.5" fill="#0284c7" />
  <line x1="21.75" y1="32" x2="21.75" y2="40" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />
  <line x1="18" y1="36" x2="25.5" y2="36" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />

  <path d="M22 52 V 43 A 3.5 3.5 0 0 1 29 43 V 52 Z" fill="#334155" />
  <circle cx="27.5" cy="47.5" r="0.8" fill="#f8fafc" />

  <!-- Roof (Triangular Gable with Overhang) -->
  <path d="M8 29 L30.5 9 L53 29" fill="none" stroke="url(#roofGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#roofGlow)" />
  <polygon points="30.5,12 13,27 48,27" fill="url(#roofGrad)" />

  <!-- Attic Accent Window -->
  <circle cx="30.5" cy="21.5" r="3.5" fill="#ffffff" opacity="0.95" />
  <circle cx="30.5" cy="21.5" r="2" fill="#0369a1" />

  <!-- ============================================== -->
  <!-- FOREGROUND: MAGNIFYING GLASS (LUPE)             -->
  <!-- ============================================== -->
  <g filter="url(#glassShadow)">
    <!-- Handle extending down-right -->
    <path d="M47 45 L57.5 55.5" stroke="#091428" stroke-width="7" stroke-linecap="round" />
    <path d="M47 45 L57.5 55.5" stroke="url(#handleGrad)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="57.5" cy="55.5" r="1.5" fill="#ffffff" opacity="0.9" />

    <!-- Lens Outer Rim (Crisp White/Cyan Border) -->
    <circle cx="37" cy="35" r="14" fill="url(#lensGrad)" stroke="#ffffff" stroke-width="3" />
    <circle cx="37" cy="35" r="15.5" fill="none" stroke="#38bdf8" stroke-width="1.2" />

    <!-- Mini House silhouette seen inside the magnifying lens (Zoom effect!) -->
    <polygon points="37,28 30,34 44,34" fill="#ffffff" opacity="0.8" />
    <rect x="32" y="34" width="10" height="7" rx="1" fill="#ffffff" opacity="0.8" />
    <rect x="35" y="37" width="4" height="4" rx="0.5" fill="#0284c7" />

    <!-- Glass Reflection / Curved Flare -->
    <path d="M26 31 A 11 11 0 0 1 43 25 A 12 12 0 0 0 29 36 Z" fill="url(#flareGrad)" />
  </g>
</svg>