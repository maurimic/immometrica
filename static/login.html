<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmeldung | ImmoMetrica</title>
  
  <!-- Favicon / Tab Logo (Haus mit Lupe) -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="alternate icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7fc',
              500: '#1e73b3',
              600: '#175d94',
              700: '#004179'
            }
          }
        }
      }
    };
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-sky-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-sky-500 selection:text-white font-sans antialiased">

  <!-- Background decorative light glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md z-10">
    
    <!-- Main Login Card -->
    <div class="bg-slate-900/85 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-7 sm:p-9 space-y-6">
      
      <!-- Logo & Brand Header -->
      <div class="text-center space-y-2">
        <img src="/static/favicon.svg" alt="ImmoMetrica Logo" class="inline-block w-16 h-16 rounded-2xl shadow-xl shadow-sky-500/25 ring-4 ring-sky-500/15 mb-1 object-contain" />
        <div class="flex items-center justify-center gap-2">
          <h1 class="text-2xl font-black tracking-tight text-white">Immo<span class="text-sky-400">Metrica</span></h1>
          <span class="text-[11px] font-bold bg-sky-950 text-sky-300 border border-sky-800/80 px-2 py-0.5 rounded-full">geschützt</span>
        </div>
        <p class="text-xs text-slate-400 max-w-xs mx-auto">
          Melde dich an, um auf die Deals, Marktdaten und KI-Analysen zuzugreifen.
        </p>
      </div>

      <!-- Error Notification Banner -->
      <div id="error-banner" class="hidden p-3.5 rounded-xl bg-rose-950/60 border border-rose-800 text-rose-200 text-xs flex items-start gap-2.5 animate-shake">
        <i data-lucide="alert-triangle" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
        <div id="error-message" class="flex-1 font-medium">Benutzername oder Passwort ist nicht korrekt.</div>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4">
        
        <!-- Username Input -->
        <div class="space-y-1.5">
          <label for="username" class="block text-xs font-semibold text-slate-300">
            Benutzername
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <input type="text" id="username" name="username" required autocomplete="username"
                   placeholder="z. B. admin"
                   class="w-full pl-10 pr-3.5 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-white text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all">
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label for="password" class="block text-xs font-semibold text-slate-300">
              Passwort
            </label>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input type="password" id="password" name="password" required autocomplete="current-password"
                   placeholder="Dein Passwort"
                   class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-white text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all">
            <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition-colors">
              <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
            <input type="checkbox" id="remember" name="remember" checked
                   class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-sky-600 focus:ring-sky-500 focus:ring-offset-slate-900">
            <span>Angemeldet bleiben (30 Tage)</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn"
                class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white font-bold text-sm shadow-lg shadow-sky-600/30 flex items-center justify-center gap-2 transition-all cursor-pointer">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span id="btn-text">Anmelden</span>
          <div id="btn-spinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
        </button>

      </form>

    </div>

    <!-- Security hint -->
    <div class="text-center mt-4 text-[11px] text-slate-500 flex items-center justify-center gap-1.5">
      <i data-lucide="lock" class="w-3 h-3 text-emerald-500"></i>
      <span>Sichere HttpOnly-Session-Authentifizierung</span>
    </div>

  </div>

  <script>
    if (window.lucide) lucide.createIcons();

    // Toggle password visibility
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password');
    let showPassword = false;

    toggleBtn.addEventListener('click', () => {
      showPassword = !showPassword;
      passwordInput.type = showPassword ? 'text' : 'password';
      const curIcon = toggleBtn.querySelector('[data-lucide], svg');
      if (curIcon) {
        const iconEl = document.createElement('i');
        iconEl.id = 'eye-icon';
        iconEl.setAttribute('data-lucide', showPassword ? 'eye-off' : 'eye');
        iconEl.className = 'w-4 h-4';
        curIcon.replaceWith(iconEl);
        if (window.lucide) lucide.createIcons();
      }
    });

    // Form submission
    const form = document.getElementById('login-form');
    const errorBanner = document.getElementById('error-banner');
    const errorMessage = document.getElementById('error-message');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      // Loading state
      submitBtn.disabled = true;
      btnText.textContent = 'Prüfe Zugangsdaten...';
      btnSpinner.classList.remove('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, remember })
        });

        let data = {};
        const text = await res.text();
        try {
          data = JSON.parse(text);
        } catch (_) {
          data = { detail: text || 'Serverfehler beim Anmelden' };
        }

        if (res.ok && data.success) {
          btnText.textContent = 'Erfolgreich! Lade App...';
          const params = new URLSearchParams(window.location.search);
          const from = (params.get('from') || '').trim();
          const isSafeRelative = from.startsWith('/') && !from.startsWith('//') && !from.startsWith('/\\');
          if (isSafeRelative) {
            window.location.href = from;
          } else if (window.location.pathname === '/login') {
            window.location.href = '/';
          } else {
            window.location.reload();
          }
        } else {
          errorMessage.textContent = data.detail || data.error || 'Benutzername oder Passwort ist nicht korrekt.';
          errorBanner.classList.remove('hidden');
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        errorMessage.textContent = 'Verbindungsfehler zum Server: ' + err.message;
        errorBanner.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Anmelden';
        btnSpinner.classList.add('hidden');
        if (window.lucide) lucide.createIcons();
      }
    });
  </script>
</body>
</html>
