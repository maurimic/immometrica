<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>ImmoMetrica | Immobilien finden, die sich rechnen</title>
  
  <!-- Favicon / Tab Logo (Haus mit Lupe) -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="alternate icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7fc',
              500: '#1e73b3',
              600: '#175d94',
              700: '#004179'
            }
          }
        }
      }
    };
  </script>
  <!-- Immediate theme check to avoid flicker -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('immo_theme') || 'system';
      const isDark = savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- MapLibre GL for OpenFreeMap -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/style.css?v=2.4">
  <!-- Sub-modules for immoApp -->
  <script src="/static/js/modules/map.js?v=2.4"></script>
  <script src="/static/js/modules/calculator.js?v=2.4"></script>
  <script src="/static/js/modules/alerts.js?v=2.5"></script>
  <script src="/static/js/modules/modals.js?v=2.4"></script>
  <!-- Alpine.js Core & Plugins -->
  <script defer src="/static/js/app.js?v=2.4"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen flex flex-col transition-colors duration-200" x-data="immoApp">


  <!-- {{HEADER}} -->

  <!-- MAIN BODY CONTAINER -->
  <main class="flex-1 w-full max-w-[1920px] mx-auto p-3 sm:p-6 lg:p-8 xl:px-10 pb-24 sm:pb-8">

    <!-- PORTAL HEALTH & SCRAPER CANARY ALERT BANNER (Global Startpage Notification) -->
    <template x-if="portalAlert && portalAlert.active">
      <div class="mb-5 p-4 rounded-xl border shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 transition-all"
           :class="portalAlert.level === 'critical'
             ? 'bg-rose-50 dark:bg-rose-950/70 border-rose-300 dark:border-rose-800 text-rose-950 dark:text-rose-100'
             : 'bg-amber-50 dark:bg-amber-950/70 border-amber-300 dark:border-amber-800 text-amber-950 dark:text-amber-100'">
        <div class="flex items-start gap-3 min-w-0 flex-1">
          <div class="p-2 rounded-lg shrink-0 mt-0.5"
               :class="portalAlert.level === 'critical' ? 'bg-rose-100 dark:bg-rose-900/60 text-rose-700 dark:text-rose-300' : 'bg-amber-100 dark:bg-amber-900/60 text-amber-700 dark:text-amber-300'">
            <i data-lucide="alert-triangle" class="w-5 h-5"></i>
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <h4 class="text-sm font-bold tracking-tight break-words" x-text="portalAlert.title || '⚠️ Portal-Warnung: Scraper eingeschränkt'"></h4>
              <span class="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded tracking-wider shrink-0"
                    :class="portalAlert.level === 'critical' ? 'bg-rose-200 dark:bg-rose-900 text-rose-800 dark:text-rose-200' : 'bg-amber-200 dark:bg-amber-900 text-amber-800 dark:text-amber-200'"
                    x-text="portalAlert.level === 'critical' ? 'Ausfall' : 'Warnung'"></span>
            </div>
            <p class="text-xs mt-1 text-slate-700 dark:text-slate-300 font-medium leading-relaxed break-words" x-text="portalAlert.message"></p>
            <div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-slate-500 dark:text-slate-400">
              <span class="flex items-center gap-1">
                <i data-lucide="bell" class="w-3 h-3 text-sky-600"></i>
                <span>Push-Benachrichtigung an Telegram gesendet</span>
              </span>
              <template x-if="portalHealth && portalHealth.last_checked_at">
                <span>Geprüft: <span x-text="formatDateTimeDE(portalHealth.last_checked_at)"></span></span>
              </template>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-2 self-end sm:self-center shrink-0">
          <button @click="runCanaryCheck(true)" :disabled="canaryChecking" class="px-3 py-1.5 text-xs font-bold rounded-lg border bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors shadow-2xs flex items-center gap-1.5 cursor-pointer">
            <svg x-show="canaryChecking" class="w-3.5 h-3.5 animate-spin text-sky-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span x-show="!canaryChecking" class="inline-flex items-center">
              <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
            </span>
            <span x-text="canaryChecking ? 'Prüfe Portale...' : 'Jetzt neu prüfen'"></span>
          </button>
          <button @click="dismissPortalAlert()" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-black/5 dark:hover:bg-white/5 transition-colors cursor-pointer" title="Benachrichtigung schließen">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </template>

    <!-- {{TAB_FEED}} -->

    <!-- {{TAB_BOARD}} -->

    <!-- {{TAB_CALCULATOR}} -->

    <!-- {{TAB_MAP}} -->

    <!-- {{TAB_INFO}} -->

    <!-- {{TAB_ALERTS}} -->

  </main>

  <!-- MOBILE BOTTOM NAVIGATION (Smartphones < 640px) -->
  <nav class="sm:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 shadow-lg px-2 py-1.5 flex items-center justify-around safe-bottom">
    <button @click="activeTab = 'feed'; window.scrollTo({top: 0, behavior: 'smooth'});" 
            class="flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all cursor-pointer"
            :class="activeTab === 'feed' ? 'text-sky-600 dark:text-sky-400 font-bold' : 'text-slate-500 dark:text-slate-400 font-medium'">
      <div class="relative">
        <i data-lucide="layout-list" class="w-5 h-5"></i>
        <template x-if="properties.length > 0">
          <span class="absolute -top-1 -right-2 px-1 text-[9px] font-bold rounded-full bg-sky-600 text-white leading-tight" x-text="properties.length > 99 ? '99+' : properties.length"></span>
        </template>
      </div>
      <span class="text-[10px] mt-0.5">Deals</span>
    </button>

    <button @click="activeTab = 'board'; window.scrollTo({top: 0, behavior: 'smooth'});" 
            class="flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all cursor-pointer"
            :class="activeTab === 'board' ? 'text-sky-600 dark:text-sky-400 font-bold' : 'text-slate-500 dark:text-slate-400 font-medium'">
      <i data-lucide="kanban" class="w-5 h-5"></i>
      <span class="text-[10px] mt-0.5">Pipeline</span>
    </button>

    <button @click="activeTab = 'calculator'; window.scrollTo({top: 0, behavior: 'smooth'});" 
            class="flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all cursor-pointer"
            :class="activeTab === 'calculator' ? 'text-sky-600 dark:text-sky-400 font-bold' : 'text-slate-500 dark:text-slate-400 font-medium'">
      <i data-lucide="calculator" class="w-5 h-5"></i>
      <span class="text-[10px] mt-0.5">Rechner</span>
    </button>

    <button @click="activeTab = 'alerts'; loadAlertsData(); window.scrollTo({top: 0, behavior: 'smooth'});" 
            class="flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all cursor-pointer"
            :class="activeTab === 'alerts' ? 'text-rose-600 dark:text-rose-400 font-bold' : 'text-slate-500 dark:text-slate-400 font-medium'">
      <div class="relative">
        <i data-lucide="radio" class="w-5 h-5" :class="activeTab === 'alerts' ? 'text-rose-600 dark:text-rose-400' : 'text-slate-500'"></i>
        <template x-if="alertFeed.length > 0">
          <span class="absolute -top-1 -right-2 px-1 text-[9px] font-bold rounded-full bg-rose-600 text-white leading-tight" x-text="alertFeed.length > 9 ? '9+' : alertFeed.length"></span>
        </template>
      </div>
      <span class="text-[10px] mt-0.5">Alerts</span>
    </button>

    <button @click="activeTab = 'map'; initMap(); window.scrollTo({top: 0, behavior: 'smooth'});" 
            class="flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all cursor-pointer"
            :class="activeTab === 'map' ? 'text-sky-600 dark:text-sky-400 font-bold' : 'text-slate-500 dark:text-slate-400 font-medium'">
      <i data-lucide="map" class="w-5 h-5"></i>
      <span class="text-[10px] mt-0.5">Karte</span>
    </button>
  </nav>

  <!-- {{MODALS}} -->
  <script>
    // Initialize Lucide icons on load and dynamic changes
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
    document.addEventListener('alpine:initialized', () => {
      setTimeout(() => lucide.createIcons(), 100);
    });
  </script>

</body>
</html>
