<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImmoMetrica | Immobilien finden, die sich rechnen</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7fc',
              500: '#1e73b3',
              600: '#175d94',
              700: '#004179'
            }
          }
        }
      }
    };
  </script>
  <!-- Immediate theme check to avoid flicker -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('immo_theme') || 'system';
      const isDark = savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- MapLibre GL for OpenFreeMap -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/style.css?v=2.2">
  <!-- Sub-modules for immoApp -->
  <script src="/static/js/modules/map.js?v=2.3"></script>
  <script src="/static/js/modules/calculator.js?v=2.3"></script>
  <script src="/static/js/modules/alerts.js?v=2.3"></script>
  <script src="/static/js/modules/modals.js?v=2.3"></script>
  <!-- Alpine.js Core & Plugins -->
  <script defer src="/static/js/app.js?v=2.2"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen flex flex-col transition-colors duration-200" x-data="immoApp">


  <!-- {{HEADER}} -->

  <!-- MAIN BODY CONTAINER -->
  <main class="flex-1 w-full max-w-[1920px] mx-auto p-4 sm:p-6 lg:p-8 xl:px-10">

    <!-- {{TAB_FEED}} -->

    <!-- {{TAB_BOARD}} -->

    <!-- {{TAB_CALCULATOR}} -->

    <!-- {{TAB_MAP}} -->

    <!-- {{TAB_INFO}} -->

    <!-- {{TAB_ALERTS}} -->

  </main>

  <!-- {{MODALS}} -->
  <script>
    // Initialize Lucide icons on load and dynamic changes
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
    document.addEventListener('alpine:initialized', () => {
      setTimeout(() => lucide.createIcons(), 100);
    });
  </script>

</body>
</html>
