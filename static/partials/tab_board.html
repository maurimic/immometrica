    <!-- TAB 2: KANBAN DEALBOARD -->
    <div x-show="activeTab === 'board'" class="space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-lg font-bold text-slate-900">Dealboard CRM Pipeline</h2>
          <p class="text-xs text-slate-500">Ziehe gefundene Immobilien per Drag & Drop durch die Phasen Deiner Ankaufsprüfung.</p>
        </div>
      </div>

      <!-- Kanban Columns -->
      <div class="kanban-board">
        <template x-for="stageData in boardStages" :key="stageData.stage.id">
          <div class="kanban-lane" @dragover="dragOver($event)" @drop="dropDeal($event, stageData.stage.id)">
            
            <!-- Lane Header -->
            <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-3">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full" :style="`background-color: ${stageData.stage.color}`"></span>
                <span class="font-bold text-xs text-slate-800" x-text="stageData.stage.name"></span>
              </div>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-white text-slate-600 border border-slate-200" x-text="stageData.count"></span>
            </div>

            <!-- Cards list -->
            <div class="kanban-cards">
              <template x-for="deal in stageData.properties" :key="deal.id">
                <div class="deal-card p-3 space-y-2 cursor-pointer" draggable="true" @dragstart="dragStart($event, deal)" @dragend="dragEnd($event)" @click="openDetailModal(deal, 'audit')">
                  
                  <div class="flex items-start justify-between">
                    <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-sky-50 text-sky-800 border border-sky-100" x-text="deal.source_portal"></span>
                    <span class="text-xs font-bold text-slate-900" x-text="formatCurrency(deal.purchase_price)"></span>
                  </div>

                  <h4 class="text-xs font-semibold text-slate-900 dark:text-slate-100 line-clamp-2">
                    <a :href="'?deal=' + deal.id + '&view=audit'" @click.prevent.stop="openDetailModal(deal, 'audit')" class="hover:text-sky-600 dark:hover:text-sky-400" x-text="deal.title"></a>
                  </h4>
                  <div class="text-[11px] text-slate-500 dark:text-slate-400" x-text="`${deal.city} • ${formatSqM(deal.living_space)}`"></div>

                  <div class="flex items-center justify-between text-xs pt-2 border-t border-slate-100 dark:border-slate-800">
                    <span class="font-bold text-slate-800 dark:text-slate-200" x-text="`Rendite: ${formatPercent(deal.gross_yield, 1)}`"></span>
                    <div class="text-right">
                      <span class="font-bold block" :class="deal.monthly_cashflow >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'" x-text="formatCashflow(deal.monthly_cashflow)"></span>
                      <template x-if="deal.is_rented && deal.monthly_cashflow < 0 && (deal.ai_analysis?.metrics?.mietspiegel_analysis?.turns_profitable || (deal.ai_analysis?.metrics?.potential_monthly_cashflow >= 0 && deal.ai_analysis?.metrics?.current_monthly_rent > 0))">
                        <span class="text-[9px] font-bold text-emerald-600 dark:text-emerald-400 block" title="Soll-Cashflow bei Mietspiegel">
                          🚀 <span x-text="formatCurrency(deal.ai_analysis?.metrics?.potential_monthly_cashflow)"></span>
                        </span>
                      </template>
                    </div>
                  </div>

                  <template x-if="stageData.stage.id === 'archiv'">
                    <div class="mt-2 text-[10px] text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 p-1.5 rounded border border-rose-200 dark:border-rose-900/60 leading-tight">
                      <span class="font-bold">Grund:</span> <span x-text="getPipelineDecisionReason(deal)"></span>
                    </div>
                  </template>

                </div>
              </template>
            </div>

          </div>
        </template>
      </div>
    </div>
