  <!-- TOP HEADER -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 shadow-sm transition-colors duration-200" x-data="{ mobileMenuOpen: false }">
    <div class="w-full max-w-[1920px] mx-auto px-3 sm:px-6 lg:px-8 xl:px-10 h-14 sm:h-16 flex items-center justify-between gap-2 sm:gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <img src="/static/favicon.svg" alt="ImmoMetrica Logo" class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl shadow-md ring-1 ring-sky-500/20 object-contain" />
        <div>
          <div class="flex items-center gap-1.5 sm:gap-2">
            <span class="font-bold text-lg sm:text-xl tracking-tight text-slate-900 dark:text-white">Immo<span class="text-sky-600 dark:text-sky-400">Metrica</span></span>
            <span class="text-[10px] sm:text-xs bg-sky-100 dark:bg-sky-950 text-sky-800 dark:text-sky-300 font-semibold px-1.5 sm:px-2 py-0.5 rounded-full border border-sky-200 dark:border-sky-800">Pro</span>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400 hidden lg:block">Metasuche über 40+ Portale • Sprengnetter-Marktdaten • Live-Verfügbarkeitsprüfung</p>
        </div>
      </div>

      <!-- DESKTOP ACTION TOOLS (Visible on >= md screens) -->
      <div class="hidden md:flex items-center flex-wrap justify-end gap-2">
        
        <!-- Live Status Checker Button (Global) -->
        <button @click="checkAllAvailability()" :disabled="checkingAll" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100 dark:hover:bg-emerald-900/50 border border-emerald-300 dark:border-emerald-800 rounded-lg shadow-2xs transition-colors whitespace-nowrap">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5" :class="checkingAll ? 'animate-spin text-emerald-600' : 'text-emerald-600 dark:text-emerald-400'"></i>
          <span x-text="checkingAll ? 'Prüfe Portale...' : 'Live-Status prüfen'"></span>
        </button>

        <!-- Portal Health & Scraper Canary Status Badge -->
        <button @click="runCanaryCheck(true)" :disabled="canaryChecking" 
                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg border transition-colors whitespace-nowrap shadow-2xs cursor-pointer"
                :class="(!portalHealth || portalHealth.overall === 'healthy') 
                  ? 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700' 
                  : (portalHealth.overall === 'critical' 
                    ? 'bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-400 border-rose-300 dark:border-rose-800 hover:bg-rose-100' 
                    : 'bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-400 border-amber-300 dark:border-amber-800 hover:bg-amber-100')"
                :title="canaryChecking ? 'Canary-Check läuft...' : 'Portal-Health-Status: Kleinanzeigen, ImmoScout24 & Immowelt. Klicken für Live-Prüfung'">
          <span class="w-2 h-2 rounded-full shrink-0" 
                :class="(!portalHealth || portalHealth.overall === 'healthy') ? 'bg-emerald-500' : (portalHealth.overall === 'critical' ? 'bg-rose-500 animate-ping' : 'bg-amber-500')"></span>
          <svg x-show="canaryChecking" class="w-3.5 h-3.5 animate-spin text-sky-600 dark:text-sky-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span x-show="!canaryChecking" class="inline-flex items-center">
            <i data-lucide="activity" class="w-3.5 h-3.5"></i>
          </span>
          <span x-text="canaryChecking ? 'Prüfe...' : ((!portalHealth || portalHealth.overall === 'healthy') ? 'Portale: OK' : (portalHealth.overall === 'critical' ? 'Portal gestört!' : 'Portal Warnung'))"></span>
        </button>

        <!-- Bulk Delete Deactivated Deals Button (User requested) -->
        <button @click="deleteOfflineProperties()" title="Löscht alle offline / deaktivierten Deals auf einmal aus der Datenbank" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/50 border border-rose-300 dark:border-rose-800 rounded-lg shadow-2xs transition-colors whitespace-nowrap">
          <i data-lucide="trash-2" class="w-3.5 h-3.5 text-rose-600 dark:text-rose-400"></i>
          <span>Deaktivierte löschen</span>
        </button>

        <!-- Database Deals Count Badge -->
        <div class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs whitespace-nowrap" title="Lokal in deiner SQLite-Datenbank gespeicherte Deals">
          <i data-lucide="database" class="w-3.5 h-3.5 text-slate-400"></i>
          <span class="text-slate-500 dark:text-slate-400">Deals:</span>
          <span class="font-bold text-sky-700 dark:text-sky-400" x-text="properties.length"></span>
        </div>

        <!-- Dark Mode / Theme Toggle Button -->
        <button @click="toggleTheme()" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" :title="`Farbschema: ${theme === 'system' ? 'System (Auto)' : (theme === 'dark' ? 'Dunkel' : 'Hell')} - Klicken zum Umschalten`">
          <span x-show="theme === 'system'" class="inline-flex items-center">
            <i data-lucide="monitor" class="w-4 h-4 text-sky-600 dark:text-sky-400"></i>
          </span>
          <span x-show="theme === 'dark'" class="inline-flex items-center">
            <i data-lucide="moon" class="w-4 h-4 text-amber-400"></i>
          </span>
          <span x-show="theme === 'light'" class="inline-flex items-center">
            <i data-lucide="sun" class="w-4 h-4 text-amber-500"></i>
          </span>
        </button>

        <!-- CSV Export Button -->
        <a :href="exportCsvUrl()" download class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg border border-slate-300 dark:border-slate-700 transition-colors whitespace-nowrap">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>CSV</span>
        </a>

        <!-- KI Vision & Text API-Key Button -->
        <button @click="openApiKeyModal()" 
                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg border transition-colors whitespace-nowrap cursor-pointer shadow-2xs"
                :class="(hasActiveApiKey) 
                  ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-300 dark:border-emerald-800 hover:bg-emerald-100' 
                  : 'bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 border-amber-300 dark:border-amber-800 hover:bg-amber-100'"
                :title="activeAiProvider === 'oneprovider' ? 'OneProvider Dev AI ist aktiv' : (activeAiProvider === 'gemini' ? 'Google Gemini ist aktiv' : 'API-Key hinterlegen')">
          <i data-lucide="key" class="w-3.5 h-3.5" :class="hasActiveApiKey ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-500'"></i>
          <span x-text="headerApiKeyLabel"></span>
        </button>

        <!-- User Logout Button -->
        <button @click="logout()" 
                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 hover:bg-rose-50 dark:bg-slate-800 dark:hover:bg-rose-950/40 text-slate-700 hover:text-rose-600 dark:text-slate-300 dark:hover:text-rose-400 transition-colors whitespace-nowrap cursor-pointer shadow-2xs"
                title="Sitzung beenden und abmelden">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Abmelden</span>
        </button>

      </div>

      <!-- MOBILE ACTION HEADER (Visible on < md screens: Clean & Compact) -->
      <div class="flex md:hidden items-center gap-1.5 shrink-0">
        <!-- Portal Health Status Mini Dot Button -->
        <button @click="runCanaryCheck(true)" :disabled="canaryChecking"
                class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 transition-colors flex items-center"
                :title="(!portalHealth || portalHealth.overall === 'healthy') ? 'Portale: OK' : 'Portal-Warnung'">
          <span class="w-2.5 h-2.5 rounded-full"
                :class="(!portalHealth || portalHealth.overall === 'healthy') ? 'bg-emerald-500' : (portalHealth.overall === 'critical' ? 'bg-rose-500 animate-ping' : 'bg-amber-500')"></span>
        </button>

        <!-- Dark Mode / Theme Toggle Button -->
        <button @click="toggleTheme()" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
          <span x-show="theme === 'system'" class="inline-flex items-center">
            <i data-lucide="monitor" class="w-4 h-4 text-sky-600 dark:text-sky-400"></i>
          </span>
          <span x-show="theme === 'dark'" class="inline-flex items-center">
            <i data-lucide="moon" class="w-4 h-4 text-amber-400"></i>
          </span>
          <span x-show="theme === 'light'" class="inline-flex items-center">
            <i data-lucide="sun" class="w-4 h-4 text-amber-500"></i>
          </span>
        </button>

        <!-- Mobile Tools Drawer Toggle Button -->
        <button @click="mobileMenuOpen = !mobileMenuOpen" 
                class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg border text-xs font-bold transition-colors cursor-pointer"
                :class="mobileMenuOpen ? 'bg-sky-600 text-white border-sky-600' : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700'">
          <span x-show="!mobileMenuOpen" class="inline-flex items-center"><i data-lucide="menu" class="w-4 h-4"></i></span>
          <span x-show="mobileMenuOpen" class="inline-flex items-center"><i data-lucide="x" class="w-4 h-4"></i></span>
          <span>Tools</span>
        </button>
      </div>

    </div>

    <!-- MOBILE TOOLS ACCORDION / DRAWER (Opens when tapping 'Tools' on mobile) -->
    <div x-show="mobileMenuOpen" x-cloak class="md:hidden border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 shadow-xl space-y-2 animate-in slide-in-from-top-2 duration-150">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-800 text-xs">
        <span class="font-bold text-slate-500 dark:text-slate-400">Schnellzugriff &amp; System</span>
        <div class="flex items-center gap-1.5 font-bold text-sky-700 dark:text-sky-400">
          <i data-lucide="database" class="w-3.5 h-3.5"></i>
          <span x-text="`${properties.length} Deals in DB`"></span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 text-xs">
        <!-- Live Status Checker Button -->
        <button @click="checkAllAvailability(); mobileMenuOpen = false;" :disabled="checkingAll" class="p-2 text-xs font-semibold text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 rounded-lg border border-emerald-300 dark:border-emerald-800 flex items-center justify-center gap-1.5 text-center">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5" :class="checkingAll ? 'animate-spin' : ''"></i>
          <span>Live-Status</span>
        </button>

        <!-- Canary Portal Check Button -->
        <button @click="runCanaryCheck(true); mobileMenuOpen = false;" :disabled="canaryChecking" class="p-2 text-xs font-semibold text-slate-700 dark:text-slate-300 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center gap-1.5 text-center">
          <i data-lucide="activity" class="w-3.5 h-3.5"></i>
          <span>Portale prüfen</span>
        </button>

        <!-- Bulk Delete Deactivated Deals -->
        <button @click="deleteOfflineProperties(); mobileMenuOpen = false;" class="p-2 text-xs font-semibold text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 rounded-lg border border-rose-300 dark:border-rose-800 flex items-center justify-center gap-1.5 text-center">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          <span>Deaktivierte löschen</span>
        </button>

        <!-- CSV Export Button -->
        <a :href="exportCsvUrl()" download class="p-2 text-xs font-semibold text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 rounded-lg border border-slate-300 dark:border-slate-700 flex items-center justify-center gap-1.5 text-center">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>CSV Export</span>
        </a>

        <!-- API-Key Modal Button -->
        <button @click="openApiKeyModal(); mobileMenuOpen = false;" class="p-2 text-xs font-semibold rounded-lg border flex items-center justify-center gap-1.5 text-center"
                :class="hasActiveApiKey ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-300 dark:border-emerald-800' : 'bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 border-amber-300 dark:border-amber-800'">
          <i data-lucide="key" class="w-3.5 h-3.5"></i>
          <span x-text="headerApiKeyLabel"></span>
        </button>

        <!-- Logout Button -->
        <button @click="logout()" class="p-2 text-xs font-semibold text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 rounded-lg border border-rose-300 dark:border-rose-800 flex items-center justify-center gap-1.5 text-center">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Abmelden</span>
        </button>
      </div>
    </div>

    <!-- NAVIGATION TABS (Horizontal Scrollable with Hidden Scrollbar) -->
    <div class="w-full max-w-[1920px] mx-auto px-3 sm:px-6 lg:px-8 xl:px-10 flex space-x-4 sm:space-x-6 border-t border-slate-100 dark:border-slate-800 text-sm font-medium overflow-x-auto no-scrollbar scroll-smooth flex-nowrap">
      <button @click="activeTab = 'feed'" :class="activeTab === 'feed' ? 'border-sky-600 text-sky-600 dark:text-sky-400 dark:border-sky-400 font-semibold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="py-2.5 sm:py-3 px-1 border-b-2 flex items-center gap-1.5 sm:gap-2 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
        <i data-lucide="layout-list" class="w-4 h-4"></i>
        <span>Dealfeed &amp; Metasuche</span>
        <span class="ml-1 text-[11px] px-1.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-normal" x-text="properties.length"></span>
      </button>

      <button @click="activeTab = 'board'" :class="activeTab === 'board' ? 'border-sky-600 text-sky-600 dark:text-sky-400 dark:border-sky-400 font-semibold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="py-2.5 sm:py-3 px-1 border-b-2 flex items-center gap-1.5 sm:gap-2 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
        <i data-lucide="kanban" class="w-4 h-4"></i>
        <span>Pipeline</span>
      </button>

      <button @click="activeTab = 'calculator'" :class="activeTab === 'calculator' ? 'border-sky-600 text-sky-600 dark:text-sky-400 dark:border-sky-400 font-semibold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="py-2.5 sm:py-3 px-1 border-b-2 flex items-center gap-1.5 sm:gap-2 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
        <i data-lucide="calculator" class="w-4 h-4"></i>
        <span>Cashflow-Rechner</span>
      </button>

      <button @click="activeTab = 'map'; initMap()" :class="activeTab === 'map' ? 'border-sky-600 text-sky-600 dark:text-sky-400 dark:border-sky-400 font-semibold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="py-2.5 sm:py-3 px-1 border-b-2 flex items-center gap-1.5 sm:gap-2 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
        <i data-lucide="map" class="w-4 h-4"></i>
        <span>Lagekarte</span>
      </button>

      <button @click="activeTab = 'alerts'; loadAlertsData(); setTimeout(() => lucide.createIcons(), 50)" :class="activeTab === 'alerts' ? 'border-sky-600 text-sky-600 dark:text-sky-400 dark:border-sky-400 font-semibold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="py-2.5 sm:py-3 px-1 border-b-2 flex items-center gap-1.5 sm:gap-2 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
        <i data-lucide="radio" class="w-4 h-4 text-rose-500"></i>
        <span>Suchagent &amp; Alerts</span>
        <template x-if="alertFeed.length > 0">
          <span class="ml-1 text-[11px] px-1.5 py-0.5 rounded-full bg-rose-100 dark:bg-rose-950/70 text-rose-700 dark:text-rose-300 font-bold" x-text="alertFeed.length"></span>
        </template>
      </button>

      <button @click="activeTab = 'info'; setTimeout(() => lucide.createIcons(), 50)" :class="activeTab === 'info' ? 'border-sky-600 text-sky-600 dark:text-sky-400 dark:border-sky-400 font-semibold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="py-2.5 sm:py-3 px-1 border-b-2 flex items-center gap-1.5 sm:gap-2 transition-colors whitespace-nowrap shrink-0 cursor-pointer">
        <i data-lucide="help-circle" class="w-4 h-4"></i>
        <span>Info</span>
      </button>
    </div>
  </header>
