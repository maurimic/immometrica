  <!-- TOP HEADER -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 shadow-sm transition-colors duration-200">
    <div class="w-full max-w-[1920px] mx-auto px-4 sm:px-6 lg:px-8 xl:px-10 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3 shrink-0">
        <img src="/static/favicon.svg" alt="ImmoMetrica Logo" class="w-10 h-10 rounded-xl shadow-md ring-1 ring-sky-500/20 object-contain" />
        <div>
          <div class="flex items-center gap-2">
            <span class="font-bold text-xl tracking-tight text-slate-900 dark:text-white">Immo<span class="text-sky-600 dark:text-sky-400">Metrica</span></span>
            <span class="text-xs bg-sky-100 dark:bg-sky-950 text-sky-800 dark:text-sky-300 font-semibold px-2 py-0.5 rounded-full border border-sky-200 dark:border-sky-800">Pro Clone</span>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400 hidden md:block">Metasuche über 40+ Portale • Sprengnetter-Marktdaten • Live-Verfügbarkeitsprüfung</p>
        </div>
      </div>

      <!-- Action Tools -->
      <div class="flex items-center flex-wrap justify-end gap-2 sm:gap-2.5">
        
        <!-- Live Status Checker Button (Global) -->
        <button @click="checkAllAvailability()" :disabled="checkingAll" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100 dark:hover:bg-emerald-900/50 border border-emerald-300 dark:border-emerald-800 rounded-lg shadow-2xs transition-colors whitespace-nowrap">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5" :class="checkingAll ? 'animate-spin text-emerald-600' : 'text-emerald-600 dark:text-emerald-400'"></i>
          <span x-text="checkingAll ? 'Prüfe Portale...' : 'Live-Status prüfen'"></span>
        </button>

        <!-- Bulk Delete Deactivated Deals Button (User requested) -->
        <button @click="deleteOfflineProperties()" title="Löscht alle offline / deaktivierten Deals auf einmal aus der Datenbank" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/50 border border-rose-300 dark:border-rose-800 rounded-lg shadow-2xs transition-colors whitespace-nowrap">
          <i data-lucide="trash-2" class="w-3.5 h-3.5 text-rose-600 dark:text-rose-400"></i>
          <span>Deaktivierte löschen</span>
        </button>

        <!-- Database Deals Count Badge -->
        <div class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs whitespace-nowrap" title="Lokal in deiner SQLite-Datenbank gespeicherte Deals">
          <i data-lucide="database" class="w-3.5 h-3.5 text-slate-400"></i>
          <span class="text-slate-500 dark:text-slate-400">Deals in DB:</span>
          <span class="font-bold text-sky-700 dark:text-sky-400" x-text="properties.length"></span>
        </div>

        <!-- Dark Mode / Theme Toggle Button -->
        <button @click="toggleTheme()" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" :title="`Farbschema: ${theme === 'system' ? 'System (Auto)' : (theme === 'dark' ? 'Dunkel' : 'Hell')} - Klicken zum Umschalten`">
          <template x-if="theme === 'system'">
            <i data-lucide="monitor" class="w-4 h-4 text-sky-600 dark:text-sky-400"></i>
          </template>
          <template x-if="theme === 'dark'">
            <i data-lucide="moon" class="w-4 h-4 text-amber-400"></i>
          </template>
          <template x-if="theme === 'light'">
            <i data-lucide="sun" class="w-4 h-4 text-amber-500"></i>
          </template>
        </button>

        <!-- CSV Export Button -->
        <a :href="exportCsvUrl()" download class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg border border-slate-300 dark:border-slate-700 transition-colors whitespace-nowrap">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>CSV Export</span>
        </a>

        <!-- KI Vision & Text API-Key Button -->
        <button @click="openApiKeyModal()" 
                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg border transition-colors whitespace-nowrap cursor-pointer shadow-2xs"
                :class="(hasActiveApiKey) 
                  ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-300 dark:border-emerald-800 hover:bg-emerald-100' 
                  : 'bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 border-amber-300 dark:border-amber-800 hover:bg-amber-100'"
                :title="activeAiProvider === 'oneprovider' ? 'OneProvider Dev AI ist aktiv' : (activeAiProvider === 'gemini' ? 'Google Gemini ist aktiv' : 'Google Gemini oder OneProvider API-Key hinterlegen')">
          <i data-lucide="key" class="w-3.5 h-3.5" :class="hasActiveApiKey ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-500'"></i>
          <span x-text="headerApiKeyLabel"></span>
        </button>

        <!-- User Logout Button -->
        <button @click="logout()" 
                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 hover:bg-rose-50 dark:bg-slate-800 dark:hover:bg-rose-950/40 text-slate-700 hover:text-rose-600 dark:text-slate-300 dark:hover:text-rose-400 transition-colors whitespace-nowrap cursor-pointer shadow-2xs"
                title="Sitzung beenden und abmelden">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Abmelden</span>
        </button>


      </div>

    </div>

    <!-- NAVIGATION TABS -->
    <div class="w-full max-w-[1920px] mx-auto px-4 sm:px-6 lg:px-8 xl:px-10 flex space-x-6 border-t border-slate-100 dark:border-slate-800 text-sm font-medium overflow-x-auto">
      <button @click="activeTab = 'feed'" :class="activeTab === 'feed' ? 'border-sky-600 text-sky-600 dark:text-sky-400 dark:border-sky-400 font-semibold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="py-3 px-1 border-b-2 flex items-center gap-2 transition-colors whitespace-nowrap">
        <i data-lucide="layout-list" class="w-4 h-4"></i>
        <span>Dealfeed & Metasuche</span>
        <span class="ml-1 text-xs px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-normal" x-text="properties.length"></span>
      </button>

      <button @click="activeTab = 'board'" :class="activeTab === 'board' ? 'border-sky-600 text-sky-600 dark:text-sky-400 dark:border-sky-400 font-semibold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="py-3 px-1 border-b-2 flex items-center gap-2 transition-colors whitespace-nowrap">
        <i data-lucide="kanban" class="w-4 h-4"></i>
        <span>Dealboard (Pipeline)</span>
      </button>

      <button @click="activeTab = 'calculator'" :class="activeTab === 'calculator' ? 'border-sky-600 text-sky-600 dark:text-sky-400 dark:border-sky-400 font-semibold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="py-3 px-1 border-b-2 flex items-center gap-2 transition-colors whitespace-nowrap">
        <i data-lucide="calculator" class="w-4 h-4"></i>
        <span>Cashflow-Rechner</span>
      </button>

      <button @click="activeTab = 'map'; initMap()" :class="activeTab === 'map' ? 'border-sky-600 text-sky-600 dark:text-sky-400 dark:border-sky-400 font-semibold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="py-3 px-1 border-b-2 flex items-center gap-2 transition-colors whitespace-nowrap">
        <i data-lucide="map" class="w-4 h-4"></i>
        <span>Interaktive Lagekarte</span>
      </button>

      <button @click="activeTab = 'alerts'; loadAlertsData(); setTimeout(() => lucide.createIcons(), 50)" :class="activeTab === 'alerts' ? 'border-sky-600 text-sky-600 dark:text-sky-400 dark:border-sky-400 font-semibold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="py-3 px-1 border-b-2 flex items-center gap-2 transition-colors whitespace-nowrap">
        <i data-lucide="radio" class="w-4 h-4 text-rose-500"></i>
        <span>Suchagent & Alerts</span>
        <template x-if="alertFeed.length > 0">
          <span class="ml-1 text-xs px-2 py-0.5 rounded-full bg-rose-100 dark:bg-rose-950/70 text-rose-700 dark:text-rose-300 font-bold" x-text="alertFeed.length"></span>
        </template>
      </button>

      <button @click="activeTab = 'info'; setTimeout(() => lucide.createIcons(), 50)" :class="activeTab === 'info' ? 'border-sky-600 text-sky-600 dark:text-sky-400 dark:border-sky-400 font-semibold' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'" class="py-3 px-1 border-b-2 flex items-center gap-2 transition-colors whitespace-nowrap">
        <i data-lucide="help-circle" class="w-4 h-4"></i>
        <span>Info & Anleitung</span>
      </button>
    </div>
  </header>
